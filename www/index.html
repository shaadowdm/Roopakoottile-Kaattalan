<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottery Notepad</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7086;--ac:#2f5bea;--bd:#e1e4ee;--hot:#e5484d;--cold:#2f7de1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--tx:#eceef7;--mut:#9aa0b8;--bd:#2c2f40}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e29;--tx:#eceef7;--mut:#9aa0b8;--bd:#2c2f40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:16px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 8px}
textarea{min-height:140px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button,.b{flex:1;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px}
.b2{background:var(--mut)!important}.bd{background:var(--hot)!important}
.mut{color:var(--mut);font-size:14px}
.chip{display:inline-block;padding:4px 8px;margin:2px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-variant-numeric:tabular-nums}
.res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.hide{display:none}
img{max-width:100%;border-radius:8px}
.ok{color:#1a9f5b;font-weight:600}.no{color:var(--hot);font-weight:600}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:none;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal.show{display:block}
.mbox{max-width:560px;margin:0 auto;height:100%;overflow-y:auto;background:var(--bg);border-radius:14px;padding:12px}
.mx{position:sticky;top:0;width:100%;padding:12px;border:0;border-radius:8px;background:var(--hot);color:#fff;font-size:16px;margin-bottom:10px;z-index:2}
</style></head><body><div class="wrap">
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">📝 Notepad</button><button id="t2" onclick="tab(2)">📷 Scan</button></div>

<div id="p1">
 <div class="card">
  <b>Saved lists</b>
  <select id="sel" onchange="loadList()"></select>
  <input id="name" placeholder="List name">
  <textarea id="txt" placeholder="1234, 5678, 9012 ... (paste cheyyuka)"></textarea>
  <div class="mut" id="cnt"></div>
  <div class="row" style="margin-top:8px">
   <button onclick="save()">💾 Save</button>
   <button class="bd" onclick="del()">🗑 Delete list</button>
  </div>
 </div>
 <div class="card">
  <b>Edit numbers</b>
  <input id="ed" placeholder="Numbers (comma separated)" inputmode="numeric">
  <div class="row">
   <button onclick="addN()">➕ Add</button>
   <button class="b2" onclick="remN()">➖ Remove</button>
  </div>
  <input id="ed2" placeholder="Replace: new number (old number mel type cheyyuka)" inputmode="numeric" style="margin-top:12px">
  <button class="b" style="width:100%" onclick="repN()">🔁 Replace (old → new)</button>
  <div class="mut" style="margin-top:6px">Replace: mele box-il old number, thazhe box-il new number.</div>
 </div>
</div>

<div id="p2" class="hide">
 <div class="card">
  <b>1. List select cheyyuka</b>
  <select id="sel2"></select>
  <b>2. Photo edukkuka / upload</b>
  <input type="file" id="file" accept="image/*" capture="environment" onchange="photo(this)">
  <img id="pv" class="hide">
  <b>3. Last 4 digits</b>
  <input id="last4" maxlength="4" inputmode="numeric" placeholder="Photo-yile last 4 digit">
  <button class="b" style="width:100%" onclick="check()">🔍 Check</button>
 </div>
 <div id="modal" class="modal"><div class="mbox"><button class="mx" onclick="closeM()">✖ Close</button><div id="out"></div></div></div>
</div>
</div>
<script>
let S={};
const KEY='lotto_lists_v1';
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Save cheyyaan pattiyilla')}}
const $=i=>document.getElementById(i);
const parse=t=>(t.match(/\d{4}/g)||[]);
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';}
function fill(){
 const names=Object.keys(S);
 $('sel').innerHTML='<option value="">+ New list</option>'+names.map(n=>`<option>${n}</option>`).join('');
 $('sel2').innerHTML=names.length?names.map(n=>`<option>${n}</option>`).join(''):'<option value="">(no saved list)</option>';
 cnt();
}
function cnt(){$('cnt').textContent=parse($('txt').value).length+' numbers'}
$('txt').addEventListener('input',cnt);
function loadList(){const n=$('sel').value;$('name').value=n;$('txt').value=n?S[n]:'';cnt();}
function save(){const n=$('name').value.trim();if(!n)return alert('Per kodukkuka');
 S[n]=parse($('txt').value).join(', ');persist();fill();$('sel').value=n;$('txt').value=S[n];cnt();alert('Saved');}
function del(){const n=$('sel').value;if(!n)return;if(!confirm(n+' delete cheyyano?'))return;delete S[n];persist();fill();$('name').value='';$('txt').value='';cnt();}
function cur(){return parse($('txt').value)}
function set(a){$('txt').value=a.join(', ');cnt()}
function addN(){set(cur().concat(parse($('ed').value)));$('ed').value=''}
function remN(){const r=new Set(parse($('ed').value));set(cur().filter(x=>!r.has(x)));$('ed').value=''}
function repN(){const o=parse($('ed').value)[0],n=parse($('ed2').value)[0];if(!o||!n)return alert('Rand 4-digit numbers venam');
 set(cur().map(x=>x==o?n:x));$('ed').value='';$('ed2').value='';}
function closeM(){$('modal').classList.remove('show')}
function photo(i){const f=i.files[0];if(!f)return;const p=$('pv');p.src=URL.createObjectURL(f);p.classList.remove('hide');$('last4').focus();}

// pattern signature: AAAA, AABB, ABAB, ABCD ...
function sig(s){const m={};let c=0;return[...s].map(d=>(m[d]??=String.fromCharCode(65+c++))).join('')}
function seqType(s){const d=[...s].map(Number);
 if(d.every((x,i)=>i==0||x==d[i-1]+1))return'Ascending';
 if(d.every((x,i)=>i==0||x==d[i-1]-1))return'Descending';return''}
function check(){
 const n=$('sel2').value,q=$('last4').value.trim();
 if(!n)return alert('Saved list select cheyyuka');
 if(!/^\d{4}$/.test(q))return alert('4 digit number type cheyyuka');
 const L=parse(S[n]),tot=L.length;if(!tot)return alert('List empty aanu');
 const freq={};L.forEach(x=>freq[x]=(freq[x]||0)+1);
 const dig=Array(10).fill(0);L.forEach(x=>[...x].forEach(d=>dig[d]++));
 const ds=x=>[...x].reduce((a,d)=>a+dig[d],0);
 const sg=sig(q),same=freq[q]||0;
 const patCount=L.filter(x=>sig(x)==sg).length;
 const uniq=Object.keys(freq).filter(x=>sig(x)==sg);
 uniq.sort((a,b)=>freq[b]-freq[a]||ds(b)-ds(a));
 const sq=seqType(q);
 let h=`<div class="card"><b>${q}</b> — ${same?`<span class="ok">list-il ${same} thavana und ✅</span>`:'<span class="no">list-il illa ❌</span>'}
 <div class="mut" style="margin-top:6px">Pattern: <b>${sg}</b>${sq?' ('+sq+')':''} · list-il ${patCount}/${tot} number (${(patCount*100/tot).toFixed(1)}%) ithe pattern</div></div>`;
 const rows=a=>a.length?a.map(x=>`<div class="res"><span class="chip">${x}</span><span class="mut">${freq[x]}× · digit score ${ds(x)}</span></div>`).join(''):'<div class="mut">Same pattern ulla number list-il illa</div>';
 h+=`<div class="card"><b style="color:var(--hot)">🔥 Hot → Least hot</b>${rows(uniq)}</div>`;
 h+=`<div class="card"><b style="color:var(--cold)">❄️ Least hot → Hot</b>${rows([...uniq].reverse())}</div>`;
 h+=`<div class="card"><b>Digit heat</b><div>${dig.map((c,i)=>`<span class="chip">${i}: ${c}</span>`).join('')}</div></div>`;
 $('out').innerHTML=h;$('modal').classList.add('show');$('modal').querySelector('.mbox').scrollTop=0;
}
load();fill();
</script></body></html>
